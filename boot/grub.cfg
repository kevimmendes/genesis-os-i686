# Project Genesis - GRUB configuration (used only when building an ISO).
# The ISO layout is:
#   /boot/grub/grub.cfg   <- this file
#   /boot/kernel.elf      <- build/kernel.elf
#
# The kernel is a 32-bit Multiboot1 image, so GRUB loads it with `multiboot`.

set timeout=0
set default=0

menuentry "Project Genesis - live session" {
    multiboot /boot/kernel.elf
    boot
}

# The installer entry passes `setup` on the kernel command line, which makes
# the kernel show the setup wizard (language, keyboard, disk space) before the
# shell. Nothing is written to the disk in this version; see docs/INSTALL.md.
menuentry "Install Project Genesis" {
    multiboot /boot/kernel.elf setup
    boot
}
